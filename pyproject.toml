[project]
name = "math-ocr"
version = "0.1.0"
description = "PDF to LaTeX converter using Gemini 3 Flash"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.2.0",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "stripe>=8.0.0",
    "tabulate>=0.9.0",
    "redis>=5.0.0",
    "rq>=1.16.0",
]

[tool.uv]
# This is not a package, just a script project
package = false
